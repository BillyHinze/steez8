name: Check game
on:
  push:
    branches: [main]
    paths: ['public/**', 'server/**', 'tests/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          DATABASE_DRIVER: libsql
      - run: pnpm run build:pages
        env:
          BACKEND_ORIGIN: https://steez8-api.onrender.com
      - name: Validate production connectivity scripts
        run: |
          node --check scripts/check-public-site.mjs
          node --check public/backend-warmup.js
          node --check public/status-check.js
          node --check public/basecamp-status.js
