name: Check game
on:
  push:
    branches: [main]
    paths: ['public/**', 'server/**', 'tests/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          DATABASE_DRIVER: libsql
      - run: pnpm run build:pages
        env:
          BACKEND_ORIGIN: https://steez8-api.onrender.com
      - name: Validate future Hostinger domain build without changing production
        run: |
          pnpm run build:pages
          test "$(cat dist/CNAME)" = "novacryptotool.com"
          grep -q 'https://novacryptotool.com' dist/index.html
          if grep -q 'https://steez8.me' dist/index.html; then
            echo "Old canonical URL leaked into the new domain build"
            exit 1
          fi
          grep -q 'novacryptotool.com' dist/status/index.html
        env:
          BACKEND_ORIGIN: https://steez8-api.onrender.com
          PUBLIC_SITE_ORIGIN: https://novacryptotool.com
      - name: Validate production connectivity scripts
        run: |
          node --check scripts/check-public-site.mjs
          node --check public/backend-warmup.js
          node --check public/status-check.js
          node --check public/basecamp-status.js
